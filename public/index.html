<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>طلبات مهاب</title>
</head>
<body>
  <h2>طلب جديد</h2>
  <a href="/admin.html">
  <button type="button">لوحة الإدارة</button>
</a>
  <form id="orderForm">
    <input type="text" id="phone" placeholder="رقم الجوال"><br>
    <input type="text" id="item" placeholder="الصنف"><br>
    <input type="text" id="addons" placeholder="إضافات"><br>
    <input type="number" id="price" placeholder="السعر"><br>
    <textarea id="notes" placeholder="ملاحظات"></textarea><br>
    <button type="submit">إرسال الطلب</button>
  </form>

  <script>
    document.getElementById("orderForm").onsubmit = async function(e) {
      e.preventDefault();
      const order = {
        customerPhone: phone.value,
        items: [{
          name: item.value,
          price: parseFloat(price.value),
          addons: addons.value.split(",")
        }],
        notes: notes.value,
        total: parseFloat(price.value)
      };

      const res = await fetch("/api/order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(order)
      });

      const result = await res.json();
      alert(result.message || "تم إرسال الطلب");
    };
  </script>
</body>
</html>
